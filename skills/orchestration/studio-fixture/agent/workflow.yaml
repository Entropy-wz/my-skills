id: studio-fixture
name: studio-fixture
version: "1"
summary: Graph-first fixture for Agent Flow Studio acceptance.
when:
  - Testing studio save round-trip
when_not:
  - Production demos
banned_actions:
  - push
  - pr_create
inputs:
  - repo root
outputs:
  - report
nodes:
  - id: step-1
    type: step
    label: First step
    notes: hello
  - id: gate-1
    type: gate
    label: Need gates
    ref: ship-gate
edges:
  - from: step-1
    to: gate-1
ui:
  step-1:
    x: 100
    y: 80
  gate-1:
    x: 320
    y: 80
