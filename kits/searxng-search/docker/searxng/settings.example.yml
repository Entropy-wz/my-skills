# SearXNG settings for kits/searxng-search (MVP)
# Docs: https://docs.searxng.org/admin/settings/settings.html
# Local copy: tools/ensure-secret.ps1 → settings.yml (gitignored)

use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - bing
      - brave
      - wikipedia
      - wikidata

general:
  instance_name: "my-toolkit searxng"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  secret_key: "REPLACE_ME_RUN_ensure-secret"
  limiter: false
  image_proxy: false

# Bing is disabled in SearXNG defaults — force-enable for CN/EN coverage.
engines:
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false

outgoing:
  request_timeout: 8.0
